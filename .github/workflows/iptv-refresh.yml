name: Refresh IPTV playlist
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python iptv/build.py
      - name: Publish playlist if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv/combined.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Refresh combined IPTV channels"
            git push
          fi
