name: Wazo TV — IPTV source regression

on:
  push:
    branches: [main]
    paths:
      - 'iptv/*.py'
      - '.github/workflows/wazo-iptv-tests.yml'
      - '.github/workflows/wazo-iptv-refresh.yml'
  pull_request:
    paths:
      - 'iptv/*.py'
      - '.github/workflows/wazo-iptv-tests.yml'
      - '.github/workflows/wazo-iptv-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run IPTV regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s iptv -p 'test_*.py' -v
      - name: Check Python syntax
        run: python -m compileall -q iptv
