name: Wazo EPG coverage comparison (no publish)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: EPG matching unit tests
        run: python iptv/test_epg_merge.py
      - name: Compare EPG sources offline (do not publish)
        run: python iptv/epg_coverage_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epg-coverage-comparison
          path: ${{ runner.temp }}/wazo-epg-coverage/preview_report.json
          if-no-files-found: warn
